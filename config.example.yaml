ssh:
  host: <IP>
  user: <USER>
  port: 22
  key_file: ~/.ssh/id_ed25519 # omit to use ssh-agent

log:
  level: info # debug | info | warn | error (default: info)

# local - directory where general run output lands
destination: <PATH>
# variable for output_dir (overrides destination)
output_path: <PATH>

# each job runs a command on the remote host and captures its stdout
# into <destination>/<timestamp>/<name>/<output>
jobs:
  - name: <NAME>
    command: docker exec <CONTAINER> pg_dump -U postgres <DB-NAME>
    output: <FILENAME>.<EXT>
    timeout: 2m # per-job limit, e.g. "90s", "30m", "2h" (default: 2m, max: 12h)
    # manual: true # manual jobs are excluded from full runs, must be ran with -only flag
    # output_dir: <PATH> # write straight into this existing dir

  # ...
